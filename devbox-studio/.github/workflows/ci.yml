name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare environment file
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
      - name: Validate docker compose configuration
        run: docker compose config

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    steps:
      - uses: actions/checkout@v6
      - name: Prepare environment file
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Start services
        run: docker compose up -d

      - name: Wait for healthy services
        run: |
          echo "Waiting for services..."
          ready=false
          for i in $(seq 1 30); do
            if docker compose ps --format json | jq -s -e 'length > 0 and all(.[]; .State == "running" and (.Health == "" or .Health == "healthy"))' > /dev/null; then
              echo "All services ready."
              ready=true
              break
            fi
            echo "Attempt $i/30: services are not ready..."
            sleep 5
          done
          docker compose ps
          if [ "$ready" != "true" ]; then
            docker compose logs
            exit 1
          fi
      - name: Verify API response
        run: |
          API_PORT=$(docker compose port api 8080 | awk -F: '{print $NF}' | head -n 1)
          for i in $(seq 1 30); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost:${API_PORT}/health" || echo "000")
            echo "API health check attempt $i/30: $STATUS"
            if [ "$STATUS" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs api
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
