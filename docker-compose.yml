services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:0:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dev-network

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:0:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:0:5173"
    networks:
      - dev-network

  api:
    image: golang:1.22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    command: sh -c "go run main.go"
    restart: unless-stopped
    ports:
      - "127.0.0.1:0:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - dev-network

volumes:
  db-data:
  frontend-node-modules:
  go-mod-cache:

networks:
  dev-network:
    driver: bridge
