name: End-of-life check

# Pinned component versions in internal/config/versions.go are bumped by hand,
# so nothing notices when one reaches end of life. This compares them with
# endoflife.date and fails when a release line has ended or ends within 45 days.
on:
  pull_request:
    paths:
      - "internal/config/versions.go"
      - "internal/config/eol_test.go"
      - "internal/config/eol_network_test.go"
      - ".github/workflows/eol-check.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eol:
    name: Pinned versions are still supported
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Compare pinned versions with endoflife.date
        run: go test -tags eol -count=1 -v -run TestPinnedComponentsAreSupported ./internal/config
