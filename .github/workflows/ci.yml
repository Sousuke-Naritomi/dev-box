name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  studio-backend:
    name: DevBox Studio API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: devbox-studio/backend/go.mod
          cache: false
      - name: Test Studio API
        working-directory: devbox-studio/backend
        run: go test ./...

  studio-frontend:
    name: DevBox Studio frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: devbox-studio/frontend/package-lock.json
      - name: Install dependencies
        working-directory: devbox-studio/frontend
        run: npm ci
      - name: Build Studio frontend
        working-directory: devbox-studio/frontend
        run: npm run build

  generated-compose:
    name: Validate generated Compose
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - "--frontend=react --backend=go --database=postgres --cache=redis --nginx --monitoring"
          - "--frontend=none --backend=node --database=mysql --cache=none"
          - "--frontend=vue --backend=none --database=none --cache=none"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Generate stack
        run: go run . init ${{ matrix.stack }} --force --output-dir "$RUNNER_TEMP/generated"
      - name: Validate Compose
        working-directory: ${{ runner.temp }}/generated
        run: docker compose config --quiet

  declarative-config:
    name: Replay declarative project configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Generate initial project
        run: go run . init --frontend=react --backend=node --database=postgres --cache=redis --nginx --monitoring --cicd --force --output-dir "$RUNNER_TEMP/initial"
      - name: Replay from dev-box.yaml
        run: go run . init --config "$RUNNER_TEMP/initial/dev-box.yaml" --force --output-dir "$RUNNER_TEMP/replayed"
      - name: Verify stable configuration
        run: diff -u "$RUNNER_TEMP/initial/dev-box.yaml" "$RUNNER_TEMP/replayed/dev-box.yaml"
      - name: Validate replayed Compose
        working-directory: ${{ runner.temp }}/replayed
        run: docker compose config --quiet

  generated-kubernetes:
    name: Validate generated Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Generate project configuration
        run: go run . init --frontend=react --backend=go --database=postgres --cache=redis --force --output-dir "$RUNNER_TEMP/generated"
      - name: Generate manifests from project configuration
        run: go run . k8s --config "$RUNNER_TEMP/generated/dev-box.yaml" --force --output-dir "$RUNNER_TEMP/k8s"
      - name: Validate schemas
        run: docker run --rm -v "$RUNNER_TEMP/k8s:/manifests:ro" ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary /manifests

  generated-frontend-image:
    name: Build and run generated frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Generate frontend image
        run: go run . init --frontend=react --backend=none --database=none --cache=none --force --output-dir "$RUNNER_TEMP/generated"
      - name: Build and verify image user
        run: |
          docker build -t dev-box-ci-frontend "$RUNNER_TEMP/generated/frontend"
          test "$(docker image inspect dev-box-ci-frontend --format '{{.Config.User}}')" = "101:101"
      - name: Run and verify frontend
        run: |
          docker run -d --name dev-box-ci-frontend -p 127.0.0.1::8080 dev-box-ci-frontend
          FRONTEND_PORT=$(docker port dev-box-ci-frontend 8080/tcp | awk -F: '{print $NF}')
          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${FRONTEND_PORT}/" >/dev/null && exit 0
            sleep 2
          done
          docker logs dev-box-ci-frontend
          exit 1
      - name: Clean up containers
        if: always()
        run: docker rm -f dev-box-ci-frontend || true

  generated-backend-images:
    name: Build and run generated backend (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: node
            user: "10001:10001"
          - backend: python
            user: "10001:10001"
          - backend: go
            user: "10001:10001"
          - backend: php
            user: "www-data"
          - backend: java
            user: "10001:10001"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Generate backend image
        run: go run . init --frontend=none --backend=${{ matrix.backend }} --database=none --cache=none --force --output-dir "$RUNNER_TEMP/generated"
      - name: Build and verify image user
        run: |
          docker build -t dev-box-ci-api "$RUNNER_TEMP/generated/backend"
          test "$(docker image inspect dev-box-ci-api --format '{{.Config.User}}')" = "${{ matrix.user }}"
      - name: Run and verify API
        run: |
          docker run -d --name dev-box-ci-api -p 127.0.0.1::8080 dev-box-ci-api
          API_PORT=$(docker port dev-box-ci-api 8080/tcp | awk -F: '{print $NF}')
          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${API_PORT}/health" >/dev/null && exit 0
            sleep 2
          done
          docker logs dev-box-ci-api
          exit 1
      - name: Clean up container
        if: always()
        run: docker rm -f dev-box-ci-api || true

  generated-terraform:
    name: Validate generated Terraform (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, gcp, azure]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
      - name: Generate Terraform
        run: go run . deploy --provider=${{ matrix.provider }} --force --output-dir "$RUNNER_TEMP/terraform"
      - name: Format check
        working-directory: ${{ runner.temp }}/terraform
        run: terraform fmt -check -recursive
      - name: Initialize
        working-directory: ${{ runner.temp }}/terraform
        run: terraform init -backend=false
      - name: Validate
        working-directory: ${{ runner.temp }}/terraform
        run: terraform validate
      - name: Security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ runner.temp }}/terraform
          severity: CRITICAL,HIGH
          exit-code: "1"
