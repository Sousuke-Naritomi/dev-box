name: Security scan

# Vulnerabilities are published over time, so dependency snapshots go stale
# even when nothing in this repository changes. Besides pull requests that
# touch the templates or dependencies, this runs weekly on the default branch.
on:
  pull_request:
    paths:
      - "internal/generator/templates/**"
      - "go.mod"
      - "go.sum"
      - "devbox-studio/**/package-lock.json"
      - ".github/workflows/security-scan.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-projects:
    name: Scan generated project (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: react-node
            flags: "--frontend=react --backend=node --database=mysql --cache=redis --nginx --monitoring --cicd"
          - name: vue-python
            flags: "--frontend=vue --backend=python --database=postgres --cache=none"
          - name: php
            flags: "--frontend=none --backend=php --database=none --cache=none"
          - name: java
            flags: "--frontend=none --backend=java --database=none --cache=none"
          - name: go
            flags: "--frontend=none --backend=go --database=none --cache=none"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.70.0"
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          install_dir="${RUNNER_TEMP}/trivy-bin"
          mkdir -p "${install_dir}"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${archive}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" -C "${install_dir}" trivy
          echo "${install_dir}" >> "${GITHUB_PATH}"
      - name: Generate the project
        run: go run . init ${{ matrix.flags }} --force --output-dir "$RUNNER_TEMP/project"
      # The same scan the generated workflow runs, so a project created today
      # does not start with a failing Security Scan job.
      - name: Scan like the generated CI
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: ${{ runner.temp }}/project
          severity: CRITICAL,HIGH
          exit-code: "1"
      # Trivy cannot resolve version ranges such as flask==3.1.*, so audit the
      # Python requirements by resolving them.
      - uses: actions/setup-python@v6
        if: matrix.name == 'vue-python'
        with:
          python-version: "3.12"
      - name: Audit Python requirements
        if: matrix.name == 'vue-python'
        run: |
          pip install --quiet pip-audit
          pip-audit -r "$RUNNER_TEMP/project/backend/requirements.txt"

  repository:
    name: Scan repository dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.70.0"
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          install_dir="${RUNNER_TEMP}/trivy-bin"
          mkdir -p "${install_dir}"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${archive}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" -C "${install_dir}" trivy
          echo "${install_dir}" >> "${GITHUB_PATH}"
      - name: Scan Go modules and lockfiles
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
